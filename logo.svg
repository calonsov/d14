<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4040"/>
      <stop offset="1" stop-color="#9b0000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- anillo base tenue -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ff2a2a" stroke-opacity="0.15" stroke-width="6"/>
  <!-- arco exterior giratorio -->
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="88" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round" stroke-dasharray="180 373">
      <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- anillo interior discontinuo girando al revés -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#ff2a2a" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="4 10">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="100" y="121" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="url(#g)" filter="url(#glow)">D14</text>
</svg>
