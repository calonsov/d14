  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #ff1f1f;
      font-family: "Arial Black", Arial, Helvetica, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, rgba(255,0,0,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .logo {
      width: clamp(90px, 14vw, 160px);
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(5rem, 22vw, 16rem);
      line-height: 1;
      letter-spacing: 0.05em;
      text-shadow: 0 0 25px rgba(255,0,0,0.6), 0 0 60px rgba(255,0,0,0.3);
    }
    p {
      margin-top: 1.5rem;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(1rem, 3vw, 1.6rem);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #ff5a5a;
      opacity: 0.85;
    }
    p::after { content: "_"; animation: blink 1s steps(1) infinite; }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(255,0,0,0.5)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 18px rgba(255,0,0,0.9)); transform: scale(1.04); }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
